# _quarto.yml: the starter project for a WFRC Quarto site.
#
# `quarto use template WFRCAnalytics/wfrc-brand` copies this file with index.qmd, contact/ and
# terms/, and installs the wfrc-brand extension. Everything org-wide (theme, highlight style, layout,
# navbar social menu, footer, freeze) comes from wfrc-shared.yml, so a site only states what is its own.
#
# The documentation site for this repo is the same project rendered with `--profile docs`
# (see _quarto-docs.yml). The starter never sees those pages.

project:
  type: website
  # Quarto does not copy extension files into the output; the card banners must be listed.
  resources:
    - _extensions/wfrc-brand/assets/cards/*.svg
  # Required path: Quarto does not discover a brand file inside an extension.
  # For offline builds or no request to Google Fonts, use brand-offline.yml instead.
  brand: _extensions/wfrc-brand/brand.yml

metadata-files:
  - _extensions/wfrc-brand/wfrc-shared.yml

website:
  title: "My WFRC site"                                   # TODO: your site's name
  description: "One sentence about what this site offers." # TODO
  site-url: "https://wfrcanalytics.github.io/my-site"      # TODO: where it will be published
  navbar:
    left:
      - href: index.qmd
        text: Home

# Quarto lists (navbar items, footer links) append across config levels instead of replacing.
# Do not repeat the navbar `right`/`tools` or `page-footer` lists that wfrc-shared.yml already
# supplies, or they appear twice.
