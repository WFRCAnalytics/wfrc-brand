# _quarto.yml — dev project for the wfrc-brand extension (the preview site in docs/).
#
# This is also the smallest correct downstream setup. Everything org-wide (theme,
# highlight style, layout defaults, navbar social menu, footer, freeze) comes from
# wfrc-shared.yml, so a project only states what is its own.

project:
  type: website
  output-dir: docs
  # The brand file path must be explicit: Quarto does not discover brand.yml inside an extension.
  brand: _extensions/wfrc-brand/brand.yml

metadata-files:
  - _extensions/wfrc-brand/wfrc-shared.yml

website:
  title: "Analytics"
  description: "The Wasatch Front Regional Council builds consensus and enhances quality of life by developing and implementing visions and plans for a well-functioning multi-modal transportation system, livable communities, a strong economy, and a healthy environment."
  site-url: "https://wfrcanalytics.github.io"
  navbar:
    left:
      - href: example.qmd
        text: Components
      - href: example-landing.qmd
        text: Landing page
      - href: example-dashboard.qmd
        text: Dashboard
      - href: https://github.com/WFRCAnalytics/wfrc-brand#readme
        text: README
        target: _blank

# Quarto lists (navbar items, footer links) append across config levels instead of replacing.
# Do not repeat the navbar `right`/`tools` or `page-footer` lists that wfrc-shared.yml already
# supplies, or they appear twice.
